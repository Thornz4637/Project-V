<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project-V</title>

    <style>
        body {
            margin: 0;
            background: black;
            color: white;
            font-family: Arial, sans-serif;

            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        h1 {
            margin: 0;
            font-size: 48px;
        }

        #loading {
            font-size: 20px;
            margin-top: 10px;
        }
    </style>
</head>

<body>

    <h1>Project-V</h1>
    <div id="loading">Loading.</div>

    <script>
        const loading = document.getElementById("loading");

        let dots = 1;

        setInterval(() => {
            dots++;

            if (dots > 3) {
                dots = 1;
            }

            loading.textContent = "Loading" + ".".repeat(dots);
        }, 400);
    </script>

</body>
</html>
